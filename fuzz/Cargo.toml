[package]
name = "tessera-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ruma = { version = "0.17.2", features = ["state-res", "signatures", "compat-null", "compat-optional", "compat-empty-string-null", "compat-arbitrary-length-ids"] }
serde_json = "1"

[dependencies.tessera-core]
path = "../crates/tessera-core"

[[bin]]
name = "canonical_json"
path = "fuzz_targets/canonical_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdu_parse"
path = "fuzz_targets/pdu_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "redaction"
path = "fuzz_targets/redaction.rs"
test = false
doc = false
bench = false

[workspace]
