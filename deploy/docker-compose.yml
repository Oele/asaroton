# asaroton with PostgreSQL. Copy deploy/asaroton.example.toml to ./data/asaroton.toml, set
# server_name, then: docker compose up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: asaroton
      POSTGRES_PASSWORD: asaroton
      POSTGRES_DB: asaroton
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asaroton"]
      interval: 5s
      timeout: 3s
      retries: 20

  asaroton:
    build: ..
    image: asaroton:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/data
    ports:
      - "8008:8008"
      - "8448:8448"
    restart: unless-stopped

  # Optional: Matrix Authentication Service (enable [mas] in asaroton.toml and point its
  # matrix.endpoint at http://asaroton:8008). See docs/deployment.md.
  # mas:
  #   image: ghcr.io/element-hq/matrix-authentication-service:latest
  #   command: ["server"]
  #   volumes:
  #     - ./mas:/data
  #   ports:
  #     - "8080:8080"

volumes:
  postgres:
