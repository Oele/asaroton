# asaroton configuration. Every section has defaults; the first three settings are required.

# Appears in all user, room and event IDs. Cannot be changed later.
server_name = "example.org"
database_url = "postgres://asaroton:asaroton@postgres/asaroton"
# Signing keys and media are stored here.
data_dir = "/data"
# Behind a reverse proxy: the URL clients use (announced in .well-known/matrix/client).
# public_base_url = "https://matrix.example.org"

[listeners.client]
bind = "0.0.0.0:8008"
# tls = { cert = "/data/fullchain.pem", key = "/data/privkey.pem" }

[listeners.federation]
bind = "0.0.0.0:8448"
# Federation must be reachable over HTTPS; terminate TLS here or in a reverse proxy.
# tls = { cert = "/data/fullchain.pem", key = "/data/privkey.pem" }

[federation]
# Serve .well-known/matrix/server so other servers use the reverse proxy on 443 instead of 8448.
# well_known_server = "matrix.example.org:443"
# Ceiling on outbound transactions per minute that carry only presence, typing, receipts or
# device lists, over all destinations; events and to-device messages are never held back.
# The default suits a handful of active users. Passing it is logged as an error, so raise it
# if that turns out to be ordinary traffic for your server.
# max_edu_transactions_per_minute = 600
# URL previews, push gateways and media redirects only reach public internet addresses.
# Exempt ranges here, for example a push gateway on the local network:
# allowed_internal_ranges = ["192.168.2.0/24"]

[registration]
enabled = false
# Synapse-compatible shared-secret registration (/_synapse/admin/v1/register):
# shared_secret = "change-me"

[rate_limiting]
enabled = true
# trust_x_forwarded_for = true   # behind a reverse proxy
# messages = { per_second = 0.2, burst = 10 }

[search]
# "word" (full-text search on English lexemes; whole words only), "substring" (case-insensitive
# substrings, language-agnostic, needs the plain text stored: run `asaroton search-backfill`
# once after switching) or "both" (their union).
mode = "word"
# substring_min_length = 3

# Voice and video calls: the LiveKit SFU this server offers (MSC4195). asaroton signs the SFU
# tokens itself, relays the SFU's signalling and writes its livekit.yaml with
# `asaroton livekit-config`; see docs/deployment.md.
# [rtc.livekit]
# api_key = "APIabc123"
# api_secret = "the-secret-from-livekit-server-generate-keys"
# url = "wss://livekit.example.org"         # only if the SFU's WebSocket is exposed separately
# api_url = "http://127.0.0.1:7880"         # defaults to the SFU listener below
# remote_can_publish = true                 # users of other servers may publish here
# [rtc.livekit.sfu]                         # listeners written into livekit.yaml
# bind = "127.0.0.1"
# port = 7880
# tcp_port = 7881
# udp_ports = [50000, 60000]
# external_ip = true                        # discover the public address at start (NAT, cloud)
# public_ip = "203.0.113.7"                 # or state it, when it is fixed: nothing to discover or fail
# [rtc.livekit.turn]                        # relay over TLS for clients whose UDP is blocked
# domain = "matrix.example.org"             # defaults to the host of public_base_url
# tls_port = 5349
# cert_file = "/etc/livekit/tls/fullchain.pem"
# key_file = "/etc/livekit/tls/privkey.pem"
# allow_peer_cidrs = ["10.0.0.5/32"]        # the SFU's own address, only when it is private (NAT)

[retention]
enabled = false
# default_max_lifetime_ms = 31536000000   # one year, for rooms without m.room.retention

[server_notices]
enabled = false

# Delegate authentication to Matrix Authentication Service (MSC3861).
[mas]
enabled = false
# endpoint = "http://mas:8080"
# secret = "shared secret, matrix.secret in the MAS config"

# User IDs made server admins at startup.
admins = []
