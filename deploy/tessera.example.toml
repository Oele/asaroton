# tessera configuration. Every section has defaults; the first three settings are required.

# Appears in all user, room and event IDs. Cannot be changed later.
server_name = "example.org"
database_url = "postgres://tessera:tessera@postgres/tessera"
# Signing keys and media are stored here.
data_dir = "/data"
# Behind a reverse proxy: the URL clients use (announced in .well-known/matrix/client).
# public_base_url = "https://matrix.example.org"

[listeners.client]
bind = "0.0.0.0:8008"
# tls = { cert = "/data/fullchain.pem", key = "/data/privkey.pem" }

[listeners.federation]
bind = "0.0.0.0:8448"
# Federation must be reachable over HTTPS; terminate TLS here or in a reverse proxy.
# tls = { cert = "/data/fullchain.pem", key = "/data/privkey.pem" }

[federation]
# Serve .well-known/matrix/server so other servers use the reverse proxy on 443 instead of 8448.
# well_known_server = "matrix.example.org:443"

[registration]
enabled = false
# Synapse-compatible shared-secret registration (/_synapse/admin/v1/register):
# shared_secret = "change-me"

[rate_limiting]
enabled = true
# trust_x_forwarded_for = true   # behind a reverse proxy
# messages = { per_second = 0.2, burst = 10 }

[search]
# "word" (full-text search on English lexemes; whole words only), "substring" (case-insensitive
# substrings, language-agnostic, needs the plain text stored: run `tessera search-backfill`
# once after switching) or "both" (their union).
mode = "word"
# substring_min_length = 3

# Voice and video calls: the LiveKit SFU this server offers (MSC4195). tessera signs the SFU
# tokens itself and `tessera livekit-config` writes the SFU's livekit.yaml from this section;
# see docs/deployment.md.
# [rtc.livekit]
# url = "wss://matrix.example.org/livekit"
# api_key = "APIabc123"
# api_secret = "the-secret-from-livekit-server-generate-keys"
# api_url = "http://127.0.0.1:7880"         # defaults to url over https
# remote_can_publish = true                 # users of other servers may publish here
# [rtc.livekit.sfu]                         # listeners written into livekit.yaml
# bind = "127.0.0.1"
# port = 7880
# tcp_port = 7881
# udp_ports = [50000, 60000]
# external_ip = true
# [rtc.livekit.turn]                        # relay over TLS for clients whose UDP is blocked
# domain = "turn.example.org"               # defaults to the host of url; clients use its port 443
# tls_port = 443
# cert_file = "/etc/livekit/tls/fullchain.pem"
# key_file = "/etc/livekit/tls/privkey.pem"

[retention]
enabled = false
# default_max_lifetime_ms = 31536000000   # one year, for rooms without m.room.retention

[server_notices]
enabled = false

# Delegate authentication to Matrix Authentication Service (MSC3861).
[mas]
enabled = false
# endpoint = "http://mas:8080"
# secret = "shared secret, matrix.secret in the MAS config"

# User IDs made server admins at startup.
admins = []
