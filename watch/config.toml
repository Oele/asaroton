# Settings for the asaroton watch job. Nothing secret lives here: the bot's access token, the
# digest room and the ssh key are in ~/.config/asaroton-watch/ (see README.md).

[issues]
repo = "Oele/asaroton"
max_new_per_run = 15          # further findings are listed in the digest, not filed

[analyst]
model = ""                    # empty: the Claude Code default
max_budget_usd = 25
timeout_minutes = 90

[window]
first_run_days = 14           # how far back the very first run looks

[spec]
repo = "matrix-org/matrix-spec"
proposals = "matrix-org/matrix-spec-proposals"

[synapse]
repo = "element-hq/synapse"

# Projects whose releases are reported. `advisories = true` also reports published security
# advisories, which usually apply to every homeserver implementation.
[[releases]]
repo = "element-hq/element-web"
[[releases]]
repo = "element-hq/element-x-android"
[[releases]]
repo = "element-hq/element-x-ios"
[[releases]]
repo = "element-hq/element-call"
[[releases]]
repo = "matrix-org/matrix-rust-sdk"
[[releases]]
repo = "matrix-org/matrix-js-sdk"
[[releases]]
repo = "ruma/ruma"
[[releases]]
repo = "livekit/livekit"
[[releases]]
repo = "element-hq/lk-jwt-service"
[[releases]]
repo = "element-hq/matrix-authentication-service"
advisories = true
[[releases]]
repo = "element-hq/dendrite"
advisories = true
[[releases]]
repo = "matrix-construct/tuwunel"
advisories = true

[forgejo]
# Continuwuity is not on GitHub.
releases = ["https://forgejo.ellis.link/api/v1/repos/continuwuation/continuwuity/releases?limit=5"]

[complement]
enabled = true
dir = "~/src/complement"
timeout_minutes = 150

[hosts.cluephone]
ssh = "root@cluephone.org"    # reached with the restricted key ~/.config/asaroton-watch/id_ed25519
database = true

[hosts.local]
local = true                  # this machine, tessera.oele.net

[matrix]
homeserver = "https://cluephone.org"
