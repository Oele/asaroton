# What scripts/check.sh does, on every push to main and every pull request: formatting,
# clippy with warnings as errors, and all unit and store tests against a PostgreSQL.
#
# The end-to-end tests (scripts/README.md) and the Complement suite are not run here: they
# take a built server and, for Complement, Docker images and a quarter of an hour.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # and by hand, from the Actions tab

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          # The role and database of .env.example. The store tests create a database each.
          POSTGRES_USER: asaroton
          POSTGRES_PASSWORD: asaroton
          POSTGRES_DB: asaroton
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asaroton"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://asaroton:asaroton@localhost/asaroton
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      # A fixed version, the one the tree is known to pass with: each new clippy brings
      # lints that would otherwise fail a pull request for code it did not touch. Raise it
      # together with whatever the new version asks for.
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: scripts/check.sh
